name: Build DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    env:
      VCVARS: ${{ matrix.arch == 'x64' && 'vcvars64.bat' || 'vcvars32.bat' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\%VCVARS%"
          cl /c /O2 /MT disasmlen.c
          cl /c /O2 /MT /Yc"pch.h" /Fp"pch.pch" pch.cpp
          cl /c /O2 /MT /Yu"pch.h" /Fp"pch.pch" dllmain.cpp keygen.cpp direct_hook.cpp
          link /DLL /OUT:aida64-hook-%ARCH%.dll dllmain.obj keygen.obj direct_hook.obj disasmlen.obj pch.obj version.lib advapi32.lib
        env:
          ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: aida64-hook-${{ matrix.arch }}
          path: aida64-hook-${{ matrix.arch }}.dll
